[package]
name = "pacenotes-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
pacenotes-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libsql = "0.6"            # embedded local file now; remote Turso later by URL
sha2 = "0.10"             # token hashing (server has no size budget)
rand = "0.8"              # token minting (admin CLI)
clap = { version = "4", features = ["derive"] }  # serve / token subcommands
anyhow = "1"
# Version notes: these are known-good major versions as of mid-2026; run
# `cargo update` and fix any breakage during M2 (see TASKS S1).
