[package]
name = "pacenotes-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The binary is a thin CLI over the library; the library is what the
# integration tests in server/tests/ drive.
[lib]
name = "pacenotes_server"
path = "src/lib.rs"

[[bin]]
name = "pacenotes-server"
path = "src/main.rs"

[dependencies]
pacenotes-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tower-http = { version = "=0.6.11", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
libsql = "=0.6.0"         # embedded local file now; remote Turso later by URL
sha2 = "=0.10.9"          # token hashing (server has no size budget)
rand = "=0.8.8"           # token minting (admin CLI)
# `env` feature: flags fall back to PACENOTES_* env vars (server/CLAUDE.md).
clap = { version = "=4.6.7", features = ["derive", "env"] }
anyhow = "=1.0.104"
# tokio-util is used for ReaderStream: tokio::fs::File -> axum Body,
# so downloads stream instead of buffering a whole zip in memory.
tokio-util = { version = "=0.7.19", features = ["io"] }
# Sidecar <name>.toml parsing for `manifest gen` (server-side only: the
# installer never sees TOML, just the merged manifest JSON).
toml = "=1.1.6"
# Versions are pinned exactly (M0); bump deliberately + commit Cargo.lock.

[dev-dependencies]
tempfile = "=3.24.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
pacenotes-shared = { workspace = true }
