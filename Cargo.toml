[workspace]
resolver = "2"
members = ["shared", "server"]
exclude = ["installer"]
# NOTE: `installer` is intentionally NOT a default workspace member.
# It only builds on Windows (x86_64-pc-windows-msvc) and must be built with
# its own profile. Build it explicitly:
#   cd installer && cargo build --release --target x86_64-pc-windows-msvc
# Keeping it out of `members` lets `cargo build` at the root work on Linux/CI
# for shared+server. It still lives in this repo and depends on `shared` by path.

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Pacenotes"]

[workspace.dependencies]
serde = { version = "1", features = ["std", "derive"] }
serde_json = "1"
pacenotes-shared = { path = "shared" }
