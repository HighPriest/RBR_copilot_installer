# Rust port of legacy/.github/workflows/cd-debugbuild-manually.yml
# Differences from the C# original:
#   - no version of its own: an untagged build is 0.0.0-dev (installer/build/release_version.rs)
#   - no Secrets.resx step: Supabase is gone, access keys are server credentials
#   - dotnet publish -> cargo build for x86_64-pc-windows-msvc

name: Pacenotes Installer Debug Build creator

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Rust (MSVC target)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: installer

    - name: Default server (the repository variable, else the local example)
      working-directory: installer
      shell: pwsh
      env:
        PACENOTES_DEFAULT_SERVER: ${{ vars.PACENOTES_DEFAULT_SERVER }}
      run: |
        if ($env:PACENOTES_DEFAULT_SERVER) {
          "PACENOTES_DEFAULT_SERVER=$env:PACENOTES_DEFAULT_SERVER" | Set-Content .env
        } else {
          Copy-Item .env.example .env
        }

    - name: Test pure-logic modules
      working-directory: installer
      run: cargo test --locked

    - name: Build the application
      working-directory: installer
      run: cargo build --locked --target x86_64-pc-windows-msvc

    - name: Verify output
      shell: pwsh
      run: |
        if (-not(Test-Path "installer\target\x86_64-pc-windows-msvc\debug\pacenotes-installer.exe" -PathType leaf)) {
          echo "Output file not found!"
          exit 1
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: pacenotes-installer-debug-build-${{ github.sha }}
        path: |
          installer/target/x86_64-pc-windows-msvc/debug/pacenotes-installer.exe
          installer/target/x86_64-pc-windows-msvc/debug/pacenotes-installer.pdb
