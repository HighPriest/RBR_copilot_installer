# Continuous integration: server + shared on Linux, installer on Windows.
# The installer is NOT a workspace member (Windows-only target), so it gets
# its own job with its own cargo invocation. See root CLAUDE.md.

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  server:
    name: shared + server (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  installer:
    name: installer (windows: lint, test, version, size gate)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer

      # The installer is excluded from the workspace, so the `server` job's
      # fmt/clippy never reach it. Lint it here or it goes unlinted entirely.
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc

      # Pure-logic tests: the lib target plus tests/gamedir.rs. The GUI tests
      # under tests/ui/ are NOT run here — they drive real dialogs and need an
      # interactive desktop session. Run the whole suite locally instead:
      #   pwsh -File installer/tests/Run-AllTests.ps1
      - name: Test (pure-logic modules)
        run: cargo test --locked

      # Cargo.toml is what the CD workflows tag releases from, so a drifted
      # VERSIONINFO would ship an .exe whose properties contradict its tag.
      - name: Version sync (Cargo.toml vs installer.rc)
        shell: pwsh
        run: .\tests\Test-VersionSync.ps1

      - name: Release build + 500 kB size gate
        shell: pwsh
        run: .\tests\Test-BinarySize.ps1

      # End-to-end against a real pacenotes-server: WinHTTP cannot be unit
      # tested, so this is the only thing that proves the client works. It
      # needs no desktop — --selftest-http writes to a file, never a window —
      # which is why it runs here while the tests/ui/ suite does not.
      - name: HTTP client vs live server
        shell: pwsh
        run: .\tests\Test-HttpClient.ps1
