# Continuous integration: server + shared on Linux, installer on Windows.
# The installer is NOT a workspace member (Windows-only target), so it gets
# its own job with its own cargo invocation. See root CLAUDE.md.

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# CI only reads the repository. Declared, so the token is not whatever the
# repository's default happens to be — a compromised action or dependency
# running in a job gets read access and nothing more.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run
# pointless; cancel it rather than queue a second full Windows build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub refuses to run a workflow file it cannot parse, silently from the
  # point of view of a push: ci.yml went unrun for weeks over one unquoted
  # colon in a job name. actionlint catches that, bad `${{ }}` expressions,
  # unknown `needs:` targets, and (with the runner's shellcheck) the shell
  # inside `run:` blocks. Pinned to a release tag, script and binary both.
  workflows:
    name: workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: actionlint
        shell: bash
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  server:
    name: shared + server (linux)
    runs-on: ubuntu-latest
    # A cold build and the test suite take a few minutes; anything near this
    # is a hang, not a slow day.
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  installer:
    name: "installer (windows: lint, test, version, size gate)"
    runs-on: windows-latest
    # Two release builds, the tests and a debug server build. Without a limit
    # a test that waits on a server that never answers holds a runner for
    # GitHub's default of 6 hours.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # Both workspaces: Test-HttpClient.ps1 builds `pacenotes-server` into the
      # repository root's target/, and without it every run rebuilt libsql and
      # the rest of the server from scratch on the slowest runner.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            installer
            .

      - name: Default server (the local address from .env.example)
        run: Copy-Item .env.example .env

      # The installer is excluded from the workspace, so the `server` job's
      # fmt/clippy never reach it. Lint it here or it goes unlinted entirely.
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      # Pure-logic tests: the unit tests beside each lib module. The GUI tests
      # under tests/ui/ are NOT run here — they drive real dialogs and need an
      # interactive desktop session. Run the whole suite locally instead:
      #   pwsh -File installer/tests/Run-AllTests.ps1
      - name: Test (pure-logic modules)
        run: cargo test --locked

      # A release's version comes from its v/X.Y.Z tag; this builds from tags
      # and reads the version back out of the binary.
      - name: Release version (tag -> build)
        shell: pwsh
        run: .\tests\Test-ReleaseVersion.ps1

      - name: Release build + 700 kB size gate + imports
        shell: pwsh
        run: .\tests\Test-BinarySize.ps1

      # End-to-end against a real pacenotes-server: WinHTTP cannot be unit
      # tested, so this is the only thing that proves the client works. It
      # needs no desktop — --selftest-http writes to a file, never a window —
      # which is why it runs here while the tests/ui/ suite does not.
      - name: HTTP client vs live server
        shell: pwsh
        run: .\tests\Test-HttpClient.ps1
