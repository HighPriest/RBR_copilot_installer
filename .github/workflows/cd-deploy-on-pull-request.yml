# Rust port of legacy/.github/workflows/cd-deploy-on-pull-request.yml
# Differences from the C# original:
#   - version comes from installer/Cargo.toml instead of the .csproj <Version>
#   - no Secrets.resx step: Supabase is gone, access keys are server credentials
#   - dotnet publish -> cargo build --release for x86_64-pc-windows-msvc,
#     gated by installer/check-size.ps1 (500 kB release gate)
#   - archived actions/create-release + upload-release-asset replaced by
#     softprops/action-gh-release (tag + asset in one step)

name: Pacenotes Installer Continues Deployment

on:
  pull_request:
    branches: [ "master" ]
    types: [ closed ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract application version
      id: get_version
      shell: pwsh
      run: |
        $file = "installer\Cargo.toml"
        if (-not (Test-Path $file)) {
          Write-Error "installer/Cargo.toml not found."
          exit 1
        }
        $version = (Select-String -Path $file -Pattern '^version\s*=\s*"(.*?)"' | Select-Object -First 1).Matches.Groups[1].Value
        if (-not $version) {
          Write-Error "Version key not found in $file."
          exit 1
        }
        echo "Application Version: $version"
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Check if tag exists
      shell: pwsh
      run: |
        git fetch --tags
        $existing_tags = git tag | Where-Object { $_ -eq "v${{ env.VERSION }}" }
        if ($existing_tags) {
          Write-Host "Tag v${{ env.VERSION }} already exists.`r`n` Please update installer/Cargo.toml.`r`n` Stopping execution."
          exit 1
        }

    - name: Setup Rust (MSVC target)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: installer

    - name: Test pure-logic modules
      working-directory: installer
      run: cargo test --locked

    - name: Build the application (release + size gate)
      working-directory: installer
      shell: pwsh
      run: .\check-size.ps1

    - name: Verify output
      shell: pwsh
      run: |
        if (-not(Test-Path "installer\target\x86_64-pc-windows-msvc\release\pacenotes-installer.exe" -PathType leaf)) {
          echo "Output file not found!"
          exit 1
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pacenotes-installer-release-v${{ env.VERSION }}
        path: installer/target/x86_64-pc-windows-msvc/release/pacenotes-installer.exe

    - name: Create release and upload installer
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ env.VERSION }}
        name: v${{ env.VERSION }}
        draft: false
        prerelease: false
        files: installer/target/x86_64-pc-windows-msvc/release/pacenotes-installer.exe
